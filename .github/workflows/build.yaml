name: Build StudioClock

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  PROJECT: StudioClock/StudioClock.csproj
  DOTNET_VERSION: 10.0.x

jobs:

  # ------------------------------------------------------------
  # Windows x64 / x86
  # ------------------------------------------------------------
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            filename: StudioClock64.exe
          - arch: x86
            rid: win-x86
            filename: StudioClock32.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test StudioClock.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/${{ matrix.rid }}

      - name: Rename executable
        shell: pwsh
        run: |
          $source = "publish/${{ matrix.rid }}/StudioClock.exe"
          $target = "publish/${{ matrix.filename }}"
          Copy-Item $source $target

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: StudioClock-windows-${{ matrix.arch }}
          path: publish/${{ matrix.filename }}
          if-no-files-found: error


  # ------------------------------------------------------------
  # macOS Apple Silicon
  # ------------------------------------------------------------
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Read version
        id: version
        run: |
          VERSION=$(dotnet msbuild "$PROJECT" -getProperty:Version | xargs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Publish
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:UseAppHost=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish/osx-arm64

      - name: Create app bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="package/StudioClock.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp -a publish/osx-arm64/. "$APP/Contents/MacOS/"

          chmod +x "$APP/Contents/MacOS/StudioClock"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>StudioClock</string>

            <key>CFBundleIdentifier</key>
            <string>de.studioclock.app</string>

            <key>CFBundleName</key>
            <string>StudioClock</string>

            <key>CFBundleDisplayName</key>
            <string>StudioClock</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>

            <key>CFBundleVersion</key>
            <string>${VERSION}</string>

            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>

            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Package app
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            package/StudioClock.app \
            StudioClock-AppleSilicon.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: StudioClock-macOS-arm64
          path: StudioClock-AppleSilicon.zip
          if-no-files-found: error


  # ------------------------------------------------------------
  # macOS Intel
  # ------------------------------------------------------------
  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Read version
        id: version
        run: |
          VERSION=$(dotnet msbuild "$PROJECT" -getProperty:Version | xargs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Publish
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:UseAppHost=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish/osx-x64

      - name: Create app bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="package/StudioClock.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp -a publish/osx-x64/. "$APP/Contents/MacOS/"

          chmod +x "$APP/Contents/MacOS/StudioClock"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>StudioClock</string>

            <key>CFBundleIdentifier</key>
            <string>de.studioclock.app</string>

            <key>CFBundleName</key>
            <string>StudioClock</string>

            <key>CFBundleDisplayName</key>
            <string>StudioClock</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>

            <key>CFBundleVersion</key>
            <string>${VERSION}</string>

            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>

            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Package app
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            package/StudioClock.app \
            StudioClock-Intel.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: StudioClock-macOS-x64
          path: StudioClock-Intel.zip
          if-no-files-found: error


  # ------------------------------------------------------------
  # Attach artifacts to published GitHub Release
  # ------------------------------------------------------------
  release-assets:
    name: Attach files to release
    if: github.event_name == 'release'
    needs:
      - windows
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Show downloaded files
        run: find artifacts -type f

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            artifacts/StudioClock-windows-x64/StudioClock64.exe \
            artifacts/StudioClock-windows-x86/StudioClock32.exe \
            artifacts/StudioClock-macOS-arm64/StudioClock-AppleSilicon.zip \
            artifacts/StudioClock-macOS-x64/StudioClock-Intel.zip \
            --repo "$REPO" \
            --clobber